name: wf-ci-develop
on: 
  pull_request:
    branches:
      - develop
    types: 
      - opened
      - synchronize
jobs:
  ci-develop-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository on the Runner
        uses: actions/checkout@v4
      - name: Lint HTML FILES with HTMLHINT
        run: npx htmlhint "**/*.html"
      - name: Lint CSS FILES with STYLELINT
        run: npx stylelint "**/*.css"
      - name: Build Website With Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"  #where to create build artifacts